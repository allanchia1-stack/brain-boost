<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HelpFundUs - Create New User</title>
  <style>
    body { font-family: 'Roboto Condensed', sans-serif; background: #fafaf5; padding: 50px; }
    .form-container { max-width: 500px; margin: auto; background: #fff; padding: 40px; border-radius: 8px; border: 1px solid #ddd; }
    h2 { text-align: center; color: #426b1f; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-create { background: #426b1f; color: #fff; }
    .btn-cancel { background: #ccc; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Create New User</h2>
    <form method="POST" action="/create-user">
      <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" required></div>
      <div class="form-group"><label>Address</label><input type="text" name="address" required></div>
      <div class="form-group">
        <label>Role</label>
        <select name="role">
            <option value="Admin">Admin</option>
            <option value="FundRaiser">FundRaiser</option>
            <option value="Donee">Donee</option>
            <option value="Manager">Manager</option>
        </select>
      </div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="window.location.href='/home'">Cancel</button>
        <button type="submit" class="btn-create">Create</button>
      </div>
    </form>
  </div>
</body>
</html>
