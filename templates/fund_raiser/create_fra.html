<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpFundUs - Create New FRA</title>
  <style>
    body { 
      font-family: 'Roboto Condensed', sans-serif; 
      background: #fafaf5; 
      margin: 0;
      padding: 20px; 
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }
    .logo {
      color: #426b1f;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
    }
    .btn-logout {
      background: #426b1f;
      color: white;
      padding: 8px 20px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }

    /* Form Container */
    .form-container { 
      max-width: 600px; 
      margin: auto; 
      background: #fff; 
      padding: 40px; 
      border: 1px solid #ddd; 
    }
    
    h2 { 
      text-align: center; 
      color: #000; 
      font-size: 28px;
      margin-top: 0;
    }
    
    .form-group { margin-bottom: 15px; }
    
    label { 
      display: block; 
      font-weight: bold; 
      color: #426b1f; 
      margin-bottom: 5px;
      font-size: 18px;
    }
    
    input, textarea { 
      width: 100%; 
      padding: 8px; 
      border: 1px solid #333; 
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }
    
    /* Buttons */
    .btn-group { 
      display: flex; 
      justify-content: space-between; 
      margin-top: 30px; 
    }
    
    button { 
      padding: 10px 25px; 
      border-radius: 0; /* Square corners like image */
      cursor: pointer; 
      font-weight: bold; 
      font-size: 18px;
    }
    
    .btn-create { 
      background: #426b1f; 
      color: #fff; 
      border: none;
    }
    
    .btn-cancel { 
      background: #fff; 
      color: #000; 
      border: 1px solid #000;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="{{ url_for('home') }}" class="logo">HelpFundUs</a>
    <a href="{{ url_for('logout_bp.logout') }}" class="btn-logout">Log out</a>
  </header>

  <div class="form-container">
    <h2>Create New Fund Raising Activity</h2>
    {% if error %}
    <div style="background:#fdecea;border:1px solid #f5c2c7;color:#b42318;padding:12px;margin-bottom:18px;">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('create_fra') }}">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" required>
      </div>
      
      <div class="form-group">
        <label>Category</label>
        <select name="category" required style="width:100%;padding:8px;border:1px solid #333;box-sizing:border-box;font-family:inherit;">
          <option value="">Select category</option>
          {% for category in categories %}
          <option value="{{ category['frc_id'] }}">{{ category['frc_name'] }}</option>
          {% endfor %}
        </select>
      </div>
      
      <div class="form-group">
        <label>From</label>
        <input type="date" name="start_date" required>
      </div>
      
      <div class="form-group">
        <label>To</label>
        <input type="date" name="end_date" required>
      </div>
      
      <div class="form-group">
        <label>Goal</label>
        <input type="number" name="goal" min="1" step="1" required>
      </div>
      
      <div class="form-group">
        <label>Description</label>
        <textarea name="description"></textarea>
      </div>
      
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="window.location.href='{{ url_for('home') }}'">Cancel</button>
        <button type="submit" class="btn-create">Create</button>
      </div>
    </form>
  </div>

</body>
</html>
