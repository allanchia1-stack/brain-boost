<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HelpFundUs - Fund Raising Activity Detail</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto Condensed', sans-serif; background-color: #fafaf5; color: #000; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background-color: #fff; border-bottom: 1px solid rgba(0,0,0,0.1); }
    .logo { font-size: 26px; font-weight: 700; color: #426b1f;  text-decoration: none; cursor: pointer; display: inline-block; }
    .logout-btn {
      background-color: #426b1f; color: #fff; text-decoration: none;
      padding: 10px 24px; border-radius: 5px; font-size: 18px; font-weight: 700;
      border: none; cursor: pointer; transition: background-color 0.2s;
    }
    .logout-btn:hover { background-color: #335318; }
    .page-body {
      display: flex; justify-content: center; align-items: flex-start;
      padding: 48px 32px;
    }
    .form-card {
      background-color: #fff; border: 1px solid #ccc;
      border-radius: 8px; padding: 36px 40px; width: 520px;
    }
    .form-card h2 {
      font-size: 22px; font-weight: 700; text-align: center;
      margin-bottom: 28px; color: #000;
    }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; color: #333; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 8px 10px; font-family: inherit; font-size: 14px;
      border: 1px solid #bbb; border-radius: 3px; outline: none; background-color: #fff;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #426b1f; }
    .field input[readonly] { background-color: #e8e8e8; color: #555; cursor: not-allowed; }
    .success-msg {
      background-color: #eaf4e0; border: 1px solid #426b1f; color: #2d5a10;
      border-radius: 4px; padding: 10px 14px; font-size: 14px; font-weight: 700;
      margin-bottom: 18px; text-align: center;
    }
    .error-msg {
      background-color: #fdecea; border: 1px solid #f5c2c7; color: #b42318;
      border-radius: 4px; padding: 10px 14px; font-size: 14px; font-weight: 700;
      margin-bottom: 18px; text-align: center;
    }
    .btn-row {
      display: flex; justify-content: space-between; align-items: center; margin-top: 28px;
    }
    .back-btn {
      background-color: #fff; color: #000; border: 1px solid #999;
      padding: 8px 20px; font-family: inherit; font-size: 14px; font-weight: 700;
      border-radius: 4px; cursor: pointer; text-decoration: none; transition: background-color 0.2s;
    }
    .back-btn:hover { background-color: #f0f0f0; }
    .update-btn {
      background-color: #426b1f; color: #fff; border: none;
      padding: 8px 20px; font-family: inherit; font-size: 14px; font-weight: 700;
      border-radius: 4px; cursor: pointer; transition: background-color 0.2s;
    }
    .update-btn:hover { background-color: #335318; }
    .suspend-btn {
      background-color: #c0392b; color: #fff; border: none;
      padding: 8px 20px; font-family: inherit; font-size: 14px; font-weight: 700;
      border-radius: 4px; cursor: pointer; transition: background-color 0.2s;
    }
    .suspend-btn:hover { background-color: #a93226; }
  </style>
</head>
<body>
  <header class="header">
    <a href="{{ url_for('home') }}" class="logo">HelpFundUs</a>
    <a href="{{ url_for('logout_bp.logout') }}" class="logout-btn">Log out</a>
  </header>
  <div class="page-body">
    <div class="form-card">
      <h2>Update Fund Raising Activity</h2>

      {% if success %}
      <div class="success-msg">Fund raising activity updated successfully!</div>
      {% endif %}

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('view_fra_bp.view_fra_detail', fra_id=fra['fra_id'], source=source) }}">
        <div class="field">
          <label>FRA ID</label>
          <input type="text" value="{{ '%03d'|format(fra['fra_id']) }}" readonly>
        </div>

        <div class="field">
          <label>Title</label>
          <input type="text" name="title" value="{{ fra['fra_title'] }}" required>
        </div>

        <div class="field">
          <label>Category</label>
          <select name="category" required>
            {% for category in categories %}
            <option value="{{ category['frc_id'] }}" {% if category['frc_id'] == fra['fra_category'] %}selected{% endif %}>
              {{ category['frc_name'] }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label>Owner</label>
          <input type="text" value="{{ fra['owner_name'] }}" readonly>
        </div>

        <div class="field">
          <label>Goal</label>
          <input type="number" name="goal" min="1" step="1" value="{{ fra['fra_donation_goal'] }}" required>
        </div>

        <div class="field">
          <label>Raised</label>
          <input type="text" value="${{ fra['fra_donation_amt'] }}" readonly>
        </div>

        <div class="field">
          <label>Start Date</label>
          <input type="date" name="start_date" value="{{ fra['fra_start_date'].strftime('%Y-%m-%d') if fra['fra_start_date'] else '' }}" required>
        </div>

        <div class="field">
          <label>End Date</label>
          <input type="date" name="end_date" value="{{ fra['fra_end_date'].strftime('%Y-%m-%d') if fra['fra_end_date'] else '' }}" required>
        </div>

        <div class="field">
          <label>Status</label>
          <input type="text" value="{{ fra['fra_status']|title }}" readonly>
        </div>

        <div class="field">
          <label>Description</label>
          <textarea name="description">{{ fra["fra_des"] }}</textarea>
        </div>

        <div class="btn-row">
          <a href="{{ back_url }}" class="back-btn">Back</a>
          <button type="submit" name="action" value="update" class="update-btn">Update</button>
          <button type="submit" name="action" value="suspend" class="suspend-btn"
            onclick="return confirm('Suspend this fund raising activity?')">Suspend</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
