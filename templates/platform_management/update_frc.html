<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Update Fund Raising Activity Category</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #fafaf5; font-family: 'Roboto Condensed', sans-serif; color: #1a1a1a; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 22px 50px; background: #fff; border-bottom: 1px solid rgba(0,0,0,0.08); }
    .logo { font-size: 26px; font-weight: 700; color: #426b1f; text-decoration: none; letter-spacing: -0.02em; }
    .logout-btn { background: #426b1f; color: #fff; border: none; padding: 10px 26px; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .logout-btn:hover { background: #335318; }
    .page { display: flex; justify-content: center; padding: 50px 20px; }
    .card { background: #fff; border-radius: 8px; padding: 40px 44px; width: 100%; max-width: 480px; border: 1px solid rgba(0,0,0,0.09); box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    h2 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; text-align: center; }
    h3 { font-size: 15px; font-weight: 400; color: #555; text-align: center; margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 5px; }
    input[type=text], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 14px; color: #1a1a1a; background: #fff; }
    input[type=text]:focus, select:focus, textarea:focus { outline: none; border-color: #426b1f; }
    textarea { resize: vertical; height: 80px; }
    .actions { display: flex; gap: 8px; margin-top: 28px; }
    .btn-cancel  { flex: 1; background: #fff; border: 1px solid #bbb; color: #333; padding: 9px 0; border-radius: 4px; font-family: inherit; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .btn-update  { flex: 1; background: #426b1f; color: #fff; border: none; padding: 9px 0; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-suspend { flex: 1; background: #c62828; color: #fff; border: none; padding: 9px 0; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-unsuspend { flex: 1; background: #888; color: #fff; border: none; padding: 9px 0; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-update:hover { background: #335318; }
    .btn-suspend:hover { background: #b71c1c; }
  </style>
</head>
<body>
  <header class="header">
    <a href="{{ url_for('home') }}" class="logo">HelpFundUs</a>
    <a href="{{ url_for('logout_bp.logout') }}" class="logout-btn">Log out</a>
  </header>
  <div class="page">
    <div class="card">
      <h2>Update Existing</h2>
      <h3>Fund Raising Activity Category</h3>
      <form method="POST">
        <input type="hidden" name="frc_id" value="{{ frc.id }}" />
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" value="{{ frc.name }}" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description">{{ frc.description or '' }}</textarea>
        </div>
        <div class="actions">
          <a href="{{ url_for('view_frc') }}" class="btn-cancel">Cancel</a>
          <button type="submit" name="action" value="update" class="btn-update">Update</button>
          {% if frc.status == 1 %}
          <button type="submit" name="action" value="suspend" class="btn-suspend">Suspend</button>
          {% else %}
          <button type="submit" name="action" value="unsuspend" class="btn-unsuspend">Unsuspend</button>
          {% endif %}
        </div>
      </form>
    </div>
  </div>
</body>
</html>
