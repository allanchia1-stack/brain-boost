<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HelpFundUs - Donee Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" />
  <style>
    body { margin: 0; background-color: #fafaf5; font-family: 'Roboto Condensed', sans-serif; color: #000; }
    .header { background: #fff; border-bottom: 1px solid rgba(0,0,0,0.1); padding: 30px 50px; text-align: center; }
    .logo { font-size: 42px; color: #426b1f; text-decoration: none; }
    .page { display: flex; justify-content: center; padding: 80px 20px; }
    .card { width: 430px; background: #fff; border: 1px solid rgba(0,0,0,0.15); padding: 45px; box-sizing: border-box; }
    h1 { margin: 0 0 35px; text-align: center; font-size: 42px; font-weight: 500; }
    label { display: block; font-size: 22px; margin-bottom: 8px; }
    input { width: 100%; height: 48px; border: 1.5px solid #454545; border-radius: 5px; font-size: 18px; padding: 8px 12px; box-sizing: border-box; margin-bottom: 24px; }
    .btn { width: 100%; background-color: #426b1f; color: white; border: none; border-radius: 5px; padding: 14px; font-size: 24px; font-weight: 700; cursor: pointer; }
    .btn:hover { background-color: #335318; }
    .error { background-color: #fdecea; border: 1px solid #f5c2c7; color: #b42318; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <header class="header">
    <a href="{{ url_for('donee_login') }}" class="logo">HelpFundUs</a>
  </header>

  <main class="page">
    <form class="card" method="POST" action="{{ url_for('donee_login') }}">
      <h1>Donee Login</h1>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <label for="email">Username / Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit" class="btn">Log in</button>
    </form>
  </main>
</body>
</html>
