<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HelpFundUs - Create New Account</title>
  <style>
    body { font-family: 'Roboto Condensed', sans-serif; background: #fafaf5; padding: 50px; }
    .header { max-width: 500px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #426b1f; font-size: 24px; font-weight: bold; text-decoration: none; }
    .logout-btn { background:#426b1f; color:white; padding:8px 18px; text-decoration:none; border-radius:4px; font-weight:bold; }
    .form-container { max-width: 500px; margin: auto; background: #fff; padding: 40px; border-radius: 8px; border: 1px solid #ddd; }
    h2 { text-align: center; color: #000; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color:#426b1f; }
    input, select { width: 100%; padding: 10px; border: 1px solid #aaa; border-radius: 4px; }
    .btn-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
    button { padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-create { background: #426b1f; color: #fff; border: none; }
    .btn-cancel { background: #fff; border: 1px solid #999; }
  </style>
</head>
<body>
  <header class="header">
    <a href="{{ url_for('home') }}" class="logo">HelpFundUs</a>
    <a href="{{ url_for('logout_bp.logout') }}" class="logout-btn">Log out</a>
  </header>
  <div class="form-container">
    <h2>Create New Account</h2>
    <form method="POST" action="{{ url_for('create_account') }}">
      <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" required></div>
      <div class="form-group"><label>Address</label><input type="text" name="address" required></div>
      <div class="form-group">
        <label>Role</label>
        <select name="role" required>
          {% for profile in profiles %}
          <option value="{{ profile['profile_role'] }}">{{ profile['profile_role'] }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="window.location.href='{{ url_for('home') }}'">Cancel</button>
        <button type="submit" class="btn-create">Create Account</button>
      </div>
    </form>
  </div>
</body>
</html>
