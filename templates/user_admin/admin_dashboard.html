<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HelpFundUs - Administrator Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" />
  <style>
    body { margin: 0; background-color: #fafaf5; font-family: 'Roboto Condensed', sans-serif; color: #000; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 30px 50px; background-color: #fff; border-bottom: 1px solid rgba(0,0,0,0.1); }
    .logo { font-size: 32px; font-weight: 500; color: #426b1f; margin: 0; text-decoration: none; cursor: pointer; display: inline-block; letter-spacing: -0.01em; }
    .logout-btn { background-color: #426b1f; color: #fff; text-decoration: none; padding: 12px 30px; border-radius: 5px; font-size: 24px; font-weight: 700; border: none; cursor: pointer; transition: background-color 0.2s; }
    .logout-btn:hover { background-color: #335318; }
    .main-content { display: flex; flex-direction: column; align-items: center; padding: 80px 20px; gap: 80px; }
    .welcome-text { font-size: 36px; font-weight: 500; margin: 0; }
    .card-container { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
    .nav-card { background-color: #fff; border: 1px solid rgba(0,0,0,0.15); border-radius: 10px; width: 260px; height: 160px; display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; color: #426b1f; font-size: 22px; font-weight: 500; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: transform 0.2s, box-shadow 0.2s; line-height: 1.3; }
    .nav-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <header class="header">
    <a href="{{ url_for('home') }}" class="logo">HelpFundUs</a>
    <a href="{{ url_for('logout_bp.logout') }}" class="logout-btn">Log out</a>
  </header>
  <main class="main-content">
    <h2 class="welcome-text">Welcome User Admin, {{ admin_identifier }}</h2>
    <div class="card-container">
      <a href="/create-user" class="nav-card">Create New User<br/>(Account &amp; Profile)</a>
      <a href="{{ url_for('view_user_profile_bp.view_user_profiles_page') }}" class="nav-card">View User Profiles</a>
      <a href="{{ url_for('view_user_account_bp.view_user_accounts_page') }}" class="nav-card">View User Accounts</a>
    </div>
  </main>
</body>
</html>
